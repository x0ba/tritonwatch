services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro

  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"

  redis:
    image: redis:8
    ports:
      - "6379:6379"

volumes:
  postgres-data: