spring.application.name=user-service
spring.config.import=optional:file:../../.env[.properties],optional:file:./.env[.properties]
server.port=${SERVER_PORT:8081}

clerk.issuer=${CLERK_ISSUER}
clerk.authorized-parties=${CLERK_AUTHORIZED_PARTIES:${CORS_ALLOWED_ORIGINS:http://localhost:5173}}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/user_service}
spring.datasource.username=${DATABASE_USERNAME:user_service}
spring.datasource.password=${DATABASE_PASSWORD:user_service}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

outbox.poll-delay-ms=${OUTBOX_POLL_DELAY_MS:1000}
outbox.batch-size=${OUTBOX_BATCH_SIZE:50}
outbox.send-timeout-seconds=${OUTBOX_SEND_TIMEOUT_SECONDS:10}

verification.email.code-ttl=${VERIFICATION_EMAIL_CODE_TTL:PT15M}
verification.postmark.server-token=${POSTMARK_SERVER_TOKEN:}
verification.postmark.from-email=${POSTMARK_FROM_EMAIL:}
verification.postmark.message-stream=${POSTMARK_MESSAGE_STREAM:outbound}
verification.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
verification.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
verification.twilio.verify-service-sid=${TWILIO_VERIFY_SERVICE_SID:}
