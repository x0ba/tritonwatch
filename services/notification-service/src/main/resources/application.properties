spring.application.name=notification-service
spring.config.import=optional:file:../../.env[.properties],optional:file:./.env[.properties]
server.port=${SERVER_PORT:8084}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/notification_service}
spring.datasource.username=${DATABASE_USERNAME:notification_service}
spring.datasource.password=${DATABASE_PASSWORD:notification_service}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=app.tritonwatch.contracts.event
spring.kafka.listener.ack-mode=record

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

notification.delivery.poll-delay-ms=${NOTIFICATION_DELIVERY_POLL_DELAY_MS:1000}
notification.delivery.batch-size=${NOTIFICATION_DELIVERY_BATCH_SIZE:50}
notification.delivery.max-attempts=${NOTIFICATION_DELIVERY_MAX_ATTEMPTS:5}

notification.postmark.server-token=${POSTMARK_SERVER_TOKEN:}
notification.postmark.from-email=${POSTMARK_FROM_EMAIL:}
notification.postmark.message-stream=${POSTMARK_MESSAGE_STREAM:outbound}

notification.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
notification.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
notification.twilio.from-number=${TWILIO_FROM_NUMBER:}
notification.twilio.messaging-service-sid=${TWILIO_MESSAGING_SERVICE_SID:}
