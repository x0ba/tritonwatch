name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: us-west-2
      TF_IN_AUTOMATION: "true"
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2
          audience: sts.amazonaws.com

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"

      - uses: docker/setup-buildx-action@v3

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Write Terraform vars
        env:
          TFVARS: ${{ secrets.TFVARS }}
        run: |
          if [[ -z "${TFVARS}" ]]; then
            echo "Environment secret TFVARS is not set." >&2
            exit 1
          fi
          printenv TFVARS > infra/aws-ecs/terraform.tfvars

      - name: Build, push, and deploy
        run: |
          image_tag="${GITHUB_SHA::12}"
          ./scripts/build-and-push-ecs-images.sh "$image_tag"
          ./scripts/deploy-ecs.sh "$image_tag"
          ./scripts/deploy-frontend.sh

      - name: Smoke test
        run: |
          for path in /health/user /health/watchlist /health/ingestion; do
            curl --fail --retry 8 --retry-all-errors --retry-delay 5 \
              "https://tritonwatch.app${path}"
          done
