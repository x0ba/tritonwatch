name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  services:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - watchlist-service
          - ingestion-service
          - notification-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: |
            services/${{ matrix.service }}/**/gradle-wrapper.properties
            shared/event-contracts/**/gradle-wrapper.properties

      - name: Compile and unit-test
        working-directory: services/${{ matrix.service }}
        run: |
          ./gradlew --no-daemon classes testClasses
          if find src/test -name '*Test.java' ! -name '*ApplicationTests.java' 2>/dev/null | grep -q .; then
            ./gradlew --no-daemon test --tests '!*ApplicationTests'
          else
            echo "No isolated unit tests in ${{ matrix.service }}"
          fi

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit

  terraform:
    name: Terraform plan
    runs-on: ubuntu-latest
    if: vars.AWS_CI_ROLE_ARN != ''
    env:
      AWS_REGION: us-west-2
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: us-west-2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"

      - name: Write Terraform vars
        env:
          TFVARS: ${{ secrets.TFVARS }}
        run: |
          if [[ -z "${TFVARS}" ]]; then
            echo "Repository secret TFVARS is not set." >&2
            exit 1
          fi
          printenv TFVARS > infra/aws-ecs/terraform.tfvars

      - name: Init and plan
        run: |
          terraform -chdir=infra/aws-ecs init -input=false
          terraform -chdir=infra/aws-ecs fmt -check
          terraform -chdir=infra/aws-ecs validate
          terraform -chdir=infra/aws-ecs plan -input=false -no-color
